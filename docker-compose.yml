services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: { context: ./api, dockerfile: Dockerfile.dev }
    working_dir: /app
    volumes: ["./api:/app", "api_build:/app/_build", "api_deps:/app/deps"]
    environment:
      DATABASE_HOST: db
      MIX_ENV: dev
      RESERVATION_STRATEGY: ${RESERVATION_STRATEGY:-postgres}
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    command: mix phx.server

  bench:
    image: node:22
    working_dir: /bench
    volumes: ["./bench:/bench", "bench_modules:/bench/node_modules"]
    environment: { API_URL: "http://api:4000" }
    profiles: ["bench"]

volumes: { pgdata: {}, api_build: {}, api_deps: {}, bench_modules: {} }
